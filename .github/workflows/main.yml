name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o Kalar_Mobile_Build_Kit-1.zip -d app_src
          ls -R app_src | head -n 100
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Fix JVM target to 17
        run: |
          find app_src -name "*.kts" -o -name "*.gradle" | xargs sed -i 's/VERSION_1_8/VERSION_17/g; s/jvmTarget = "1.8"/jvmTarget = "17"/g; s/jvmTarget = .1.8./jvmTarget = "17"/g; s/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g'
          grep -r "jvmTarget\|JavaVersion" app_src --include="*.kts" --include="*.gradle" | head -n 50
      - name: Build debug APK
        run: |
          ROOT=$(find app_src -name "settings.gradle*" -print -quit | xargs dirname)
          echo "ROOT=$ROOT"
          cd "$ROOT"
          gradle assembleDebug -x validateSigningDebug --stacktrace
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
