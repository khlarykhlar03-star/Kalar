name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o Kalar_Mobile_Build_Kit-1.zip -d app_src
          ls -R app_src | head -n 100
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Fix Java to 17
        run: |
          python3 -c "
          import pathlib
          for p in list(pathlib.Path('app_src').rglob('*.gradle')) + list(pathlib.Path('app_src').rglob('*.kts')):
              t = p.read_text(errors='ignore')
              t = t.replace('VERSION_1_8', 'VERSION_17')
              t = t.replace(chr(39)+'1.8'+chr(39), chr(39)+'17'+chr(39))
              t = t.replace(chr(34)+'1.8'+chr(34), chr(34)+'17'+chr(34))
              t = t.replace('JVM_1_8', 'JVM_17')
              t = t.replace('JvmTarget.JVM_1_8', 'JvmTarget.JVM_17')
              p.write_text(t)
              print(p)
          "
          grep -r "VERSION_17\|jvmTarget" app_src --include="*.gradle" --include="*.kts" | head -n 50
      - name: Build debug APK
       
